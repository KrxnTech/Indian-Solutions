<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041B33" />
      <stop offset="100%" stop-color="#0A3663" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="400" height="320" fill="url(#bgGrad)" />
  <rect width="400" height="320" fill="url(#grid)" />
  
  <!-- Subtle circular glow -->
  <circle cx="200" cy="160" r="90" fill="#062A4F" fill-opacity="0.5" stroke="#FFC400" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Main Illustration Graphic -->
  <g id="icon-group">
    <rect x="140" y="80" width="120" height="120" rx="10" fill="#062A4F" stroke="#FFFFFF" stroke-width="4" />
      <rect x="148" y="88" width="104" height="104" rx="6" fill="#031B33" stroke="#FFC400" stroke-width="2" />
      <polygon points="200,105 235,165 165,165" fill="#FFC400" stroke="#062A4F" stroke-width="2" />
      <text x="200" y="155" fill="#062A4F" font-family="sans-serif" font-weight="bold" font-size="28" text-anchor="middle">!</text>
      <rect x="140" y="215" width="120" height="25" rx="4" fill="#D71920" />
  </g>

  <!-- Top Badge -->
  <rect x="20" y="20" width="90" height="22" rx="4" fill="#031B33" stroke="#D71920" stroke-width="1.5" />
  <text x="65" y="35" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" letter-spacing="1" text-anchor="middle">ISS CERTIFIED</text>

  <!-- Bottom Details Strip -->
  <rect x="0" y="275" width="400" height="45" fill="#021324" />
  <line x1="0" y1="275" x2="400" y2="275" stroke="#D71920" stroke-width="2" />
  
  <text x="20" y="295" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">Photoluminescent Glow Tape</text>
  <text x="20" y="310" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Marking Tapes • Self-Charging Egress</text>

  <!-- Brand watermark -->
  <text x="380" y="303" fill="#FFC400" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" text-anchor="end">ISS</text>
</svg>