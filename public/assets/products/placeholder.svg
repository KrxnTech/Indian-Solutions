<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062A4F" />
      <stop offset="100%" stop-color="#031B33" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D71920" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFC400" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFC400" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="270" r="220" fill="url(#glowGrad)" />

  <!-- Subtle Technical Grid Accents -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
  </g>

  <!-- Central Safety Emblem / Shield -->
  <g transform="translate(400, 250)">
    <!-- Outer Shield Frame -->
    <path d="M 0 -110 L 90 -60 L 90 25 C 90 85, 0 135, 0 135 C 0 135, -90 85, -90 25 L -90 -60 Z" 
          fill="#062A4F" stroke="#334155" stroke-width="6" />

    <!-- Inner Shield Accent -->
    <path d="M 0 -95 L 75 -52 L 75 22 C 75 72, 0 115, 0 115 C 0 115, -75 72, -75 22 L -75 -52 Z" 
          fill="url(#shieldGrad)" />

    <!-- Industrial Check / Cross Motif -->
    <path d="M 0 -50 L 0 50 M -45 0 L 45 0" 
          stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <circle cx="0" cy="0" r="14" fill="#FFC400" />
  </g>

  <!-- Brand Typography -->
  <text x="400" y="440" font-family="'Montserrat', system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    INDIAN SAFETY SOLUTION
  </text>
  <text x="400" y="472" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
    INDUSTRIAL &amp; FIRE PROTECTION EQUIPMENT
  </text>
  <text x="400" y="510" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFC400" text-anchor="middle" letter-spacing="1.5">
    SPECIFICATIONS &amp; QUOTE AVAILABLE UPON REQUEST
  </text>
</svg>
