<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041B33" />
      <stop offset="100%" stop-color="#0A3663" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="400" height="320" fill="url(#bgGrad)" />
  <rect width="400" height="320" fill="url(#grid)" />
  
  <!-- Subtle circular glow -->
  <circle cx="200" cy="160" r="90" fill="#062A4F" fill-opacity="0.5" stroke="#FFC400" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Main Illustration Graphic -->
  <g id="icon-group">
    <path d="M160 240 L160 170 L145 155 C140 150 140 140 148 135 C155 130 165 135 170 142 L175 155 L175 110 C175 102 182 95 190 95 C198 95 205 102 205 110 L205 155 L205 100 C205 92 212 85 220 85 C228 85 235 92 235 100 L235 155 L235 115 C235 107 242 100 250 100 C258 100 265 107 265 115 L265 190 C265 220 245 240 215 240 Z" fill="#062A4F" stroke="#FFFFFF" stroke-width="4" />
      <path d="M160 230 L240 230" stroke="#FFC400" stroke-width="6" />
  </g>

  <!-- Top Badge -->
  <rect x="20" y="20" width="90" height="22" rx="4" fill="#031B33" stroke="#D71920" stroke-width="1.5" />
  <text x="65" y="35" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" letter-spacing="1" text-anchor="middle">ISS CERTIFIED</text>

  <!-- Bottom Details Strip -->
  <rect x="0" y="275" width="400" height="45" fill="#021324" />
  <line x1="0" y1="275" x2="400" y2="275" stroke="#D71920" stroke-width="2" />
  
  <text x="20" y="295" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">Cotton PVC Dotted Gloves</text>
  <text x="20" y="310" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Hand Protection • Seamless Knit Dotted</text>

  <!-- Brand watermark -->
  <text x="380" y="303" fill="#FFC400" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" text-anchor="end">ISS</text>
</svg>